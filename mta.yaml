_schema-version: 3.3.0
ID: example
description: A simple CAP project.
version: 1.0.0

modules:
  - name: example-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: example-db
      - name: example_auth
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci

  - name: example-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: example-db

  - name: example
    type: approuter.nodejs
    path: app/
    requires:
      - name: srv-api
        group: destinations
        properties:
          forwardAuthToken: true
          name: srv-api
          url: ~{srv-url}
      - name: example_auth
    parameters:
      disk-quota: 256M
      memory: 256M
      keep-existing-routes: true

resources:
  - name: example_auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        tenant-mode: dedicated
        xsappname: example-${org}-${space}
        oauth2-configuration:
          redirect-uris:
            - https://*.cfapps.us10-001.hana.ondemand.com/login/callback

  - name: example-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production